name: RFCHunt Unified --all & Google Mantis Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      depth:
        description: "Google Mantis audit depth (1-100)"
        required: false
        default: "100"
      target_path:
        description: "Specific --path override (defaults to full repo '.')"
        required: false
        default: "."

permissions:
  contents: read
  security-events: write

jobs:
  unified-all-scans:
    name: Unified --all Audit (Mantis + aiscan + ARTEX + RAPTOR + Smuggling)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy

      - name: Run RFCHunt --all Scan (Fusion + Abliterated Models Enforced)
        env:
          CI: "true"
          RFCHUNT_OFFLINE: "1"
        run: |
          TARGET="${{ github.event.inputs.target_path || '.' }}"
          DEPTH="${{ github.event.inputs.depth || '100' }}"
          if [ "$TARGET" = "." ]; then
            python -u rfc_hunt_swarm.py --all --repo . --deep-audit --fuzz-dry-run --poc --depth "$DEPTH"
          else
            python -u rfc_hunt_swarm.py --all --path "$TARGET" --poc --depth "$DEPTH"
          fi

      - name: Verify Unified SARIF and Summary Outputs
        run: |
          python -c '
          import json
          with open("reports/combined_report.sarif", "r", encoding="utf-8") as f:
              sarif = json.load(f)
          assert sarif["version"] == "2.1.0"
          assert len(sarif["runs"]) >= 1
          with open("reports/combined_audit_summary.json", "r", encoding="utf-8") as f:
              summary = json.load(f)
          assert summary["fusion_enabled"] is True
          assert "OBLITERATED" in summary["abliterated_model"].upper()
          assert "attack_chaining" in summary
          print("Verified combined SARIF results:", len(sarif["runs"][0]["results"]), "| ARTEX chains:", summary["attack_chaining"].get("chains_synthesized", 0))
          '

      - name: Run Mantis, ARTEX Chaining, Fusion, Remote Host & LLM Governance Tests
        env:
          CI: "true"
          RFCHUNT_OFFLINE: "1"
        run: |
          pytest tests/test_hackerone_porter.py tests/test_mission_control_server.py tests/test_all_8_categories_upgrade.py tests/test_code_verification_repair.py tests/test_arxiv_security_bridge.py tests/test_verification_inversion_hunter.py tests/test_bounty_pentest_upgrades.py tests/test_artex_attack_chaining.py tests/test_live_chaining_and_executors.py tests/test_local_mitm_and_sessions.py tests/test_approval_encryption_and_exports.py tests/test_dual_graph_engine.py tests/test_e2e_unified_scans.py tests/test_mantis_integrator.py tests/test_abliteration_fusion.py tests/test_remote_host_and_subcommands.py tests/test_llm_governance_and_schema.py tests/test_ssrf_adversarial_challenge.py tests/test_target_auth.py tests/test_deep_repo_audit.py tests/test_poc_generator.py -v --basetemp=/tmp/pytest_rfchunt

      - name: Upload Security Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfchunt-all-security-reports
          path: reports/
          if-no-files-found: error

      - name: Upload Combined SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/combined_report.sarif
          category: rfchunt-unified-all
