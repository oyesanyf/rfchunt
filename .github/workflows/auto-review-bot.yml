name: RFCHunt Solo-Developer Invariant Gate & Peer Review

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-review:
    name: Repository Invariant Gate & Peer Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify RFCHunt Security Invariants & Submit Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Inspecting PR #${PR_NUMBER} by @${PR_AUTHOR} (${PR_ASSOCIATION}) on ${REPO} (${PR_HEAD_REF} @ ${PR_HEAD_SHA})"

          FILES_JSON=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100")
          FILE_COUNT=$(echo "${FILES_JSON}" | jq 'length')
          echo "Changed files: ${FILE_COUNT}"

          # Invariant 1: Block committed private key material
          FORBIDDEN_KEYS=$(echo "${FILES_JSON}" | jq -r '.[].filename' | grep -E '\.(pem|pfx|key|p12)$' || true)
          if [ -n "${FORBIDDEN_KEYS}" ]; then
            echo "::error::Forbidden private key material detected: ${FORBIDDEN_KEYS}"
            exit 1
          fi

          # Invariant 2: Block dangerous workflow escalation patterns
          WORKFLOW_PATCHES=$(echo "${FILES_JSON}" | jq -r '.[] | select(.filename | startswith(".github/workflows/")) | .patch // empty')
          if echo "${WORKFLOW_PATCHES}" | grep -E '^\+.*(permissions:\s*write-all|persist-credentials:\s*true|pull_request[_]target)' >/dev/null 2>&1; then
            echo "::error::Unsafe workflow permission or trigger pattern detected in .github/workflows/"
            exit 1
          fi

          # Invariant 3: Verify authorized same-repo maintainer / collaborator PR
          if [ "${PR_HEAD_REPO}" = "${REPO}" ] && { [ "${PR_ASSOCIATION}" = "OWNER" ] || [ "${PR_ASSOCIATION}" = "MEMBER" ] || [ "${PR_ASSOCIATION}" = "COLLABORATOR" ]; }; then
            gh pr review "${PR_NUMBER}" --repo "${REPO}" --approve \
              --body "RFCHunt Invariant Gate: verified same-repo maintainer PR (@${PR_AUTHOR}, ${PR_ASSOCIATION}), commit ${PR_HEAD_SHA} (${FILE_COUNT} file(s)), zero private keys, and safe workflow permissions." || \
              echo "::notice::Could not auto-approve PR #${PR_NUMBER}. Ensure Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests' is enabled."
          else
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" \
              --body "RFCHunt Invariant Gate passed for commit ${PR_HEAD_SHA} (${FILE_COUNT} file(s)). Waiting for maintainer review." || true
          fi
